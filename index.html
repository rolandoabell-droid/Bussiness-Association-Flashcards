  <script type="text/babel">
    const { useState, useMemo, useEffect } = React;

    const CARDS = [{"section": "Introductory Terms Related to Business Structures", "term": "Sole Proprietorship", "definition": "A proprietorship is a business owned by a single person who has the sole right to manage, is solely entitled to the profits, and has unlimited personal liability for the debts of the business."}, {"section": "Introductory Terms Related to Business Structures", "term": "Independent Contractor", "definition": "An independent contractor is an individual with authority to act without principal's approval. Independent contractor must simply fulfill his/her duty to the principal. The independent contractor does not receive direction from the principal."}, {"section": "Introductory Terms Related to Business Structures", "term": "Partnership", "definition": "A partnership is an association of two or more persons to carry on as co-owners a business for profit."}, {"section": "Introductory Terms Related to Business Structures", "term": "Limited Partnership", "definition": "A limited partnership is a partnership formed by two or more persons under the laws of the state in which it is located, and having one or more general partners and one or more limited partners. A limited partnership requires a formal document to be filed with the state."}, {"section": "Introductory Terms Related to Business Structures", "term": "Limited Liability Partnership", "definition": "A limited liability partnership does not have a general partner; instead, every partner can participate in the management of the business. Additionally, in an LLP, every partner has limited liability for business debts."}, {"section": "Introductory Terms Related to Business Structures", "term": "Limited Liability Company", "definition": "A limited liability company is a hybrid business structure that combines the limited liability found in corporations with the tax benefits of partnerships. LLC owners are not personally liable for business debts."}, {"section": "Introductory Terms Related to Business Structures", "term": "Corporation", "definition": "A corporation is a legal entity, created in accordance with statutes, that is separate and distinct from the persons who own its stock or manage it."}, {"section": "Introductory Terms Related to Business Structures", "term": "S Corporation", "definition": "An S corporation has elected a special tax status with the IRS which allows \"pass through\" taxation. This means individual shareholders report corporate profits and losses on their individual tax returns, avoiding the double taxation that occurs with C corporations."}, {"section": "Introductory Terms Related to Business Structures", "term": "C Corporation", "definition": "A C corporation is a standard corporation, in contrast with an S corporation. Taxation of C corporations can involve double taxation since the corporation pays taxes on profits through a corporate tax return; then shareholders pay taxes again on dividends through their individual tax returns."}, {"section": "Introductory Terms Related to Business Structures", "term": "Agency", "definition": "Agency is the legal relationship that involves one person (the agent) acting on behalf of another (the principal.)"}, {"section": "Introductory Terms Related to Business Structures", "term": "Limited Liability", "definition": "Limited liability is an attribute a Corporation's shareholder has. Usually shareholders are not personally liable for the business debts of the corporation. A shareholder risks only what he has agreed to invest in the corporation and nothing more."}, {"section": "Introductory Terms Related to Business Structures", "term": "Fiduciary", "definition": "A person who is required to act for the benefit of another on all matters within the scope of their relationship, and who owes the duties of good faith, trust, confidence, and candor."}, {"section": "Introductory Terms Related to Business Structures", "term": "Conflict of Interest", "definition": "An incompatibility between one's own interests and one's duties owed to another."}, {"section": "Introductory Terms Related to Business Structures", "term": "Sole Proprietorship Liabilities and Taxation", "definition": "Owner bears unlimited personal liability for all business debts and obligations. Business income/loss passes through directly to the owner's personal return; no entity-level tax."}, {"section": "Introductory Terms Related to Business Structures", "term": "Joint Venture", "definition": "An association of two or more persons/entities to carry out a single business undertaking or limited series of transactions for profit, generally governed by partnership-law principles. Each joint venturer is generally jointly and severally liable for obligations of the venture."}, {"section": "Terms Related to Agency", "term": "Master-Servant Relationship", "definition": "The master must either possess actual control, or possesses the right to control, the physical conduct of a servant in the discharge of his duties. The most common example is the employer/employee relationship."}, {"section": "Terms Related to Agency", "term": "Establishing the Agency Relationship", "definition": "An agency relationship can be established in three ways: 1) by agreement, 2) by ratification and, 3) by estoppel."}, {"section": "Terms Related to Agency", "term": "Agency by Agreement", "definition": "Agency by agreement requires a valid, legal purpose and both parties must exhibit a manifestation of intent to be bound. Additionally, the principal must have capacity to contract. Generally, agency agreements do not require conformity with contractual formalities nor consideration to be valid."}, {"section": "Terms Related to Agency", "term": "Agency by Ratification", "definition": "If the principal accepts the benefits, or confirms conduct of agent through verbal or other means, an agency relationship by ratification is created. A partial ratification of conduct by principal is considered ratification of the entire agency relationship."}, {"section": "Terms Related to Agency", "term": "Agency by Estoppel", "definition": "If a third party detrimentally relies upon principal's misleading representations regarding agent, principal will be estopped from denying relationship."}, {"section": "Terms Related to Agency", "term": "Agent's Authority", "definition": "A principal can be bound by agent's actions if one finds: 1) actual authority, 2) apparent authority, 3) ostensible authority or, 4) power arising from agency relationship which does not depend upon principal's authority."}, {"section": "Terms Related to Agency", "term": "Agency Derived from Actual Authority", "definition": "Actual authority is derived from duties expressly assigned to the agent by the principal. Actual authority may also be implied from customary usage of the express contract terms, or the principal's behavior. Actual authority will exist even if the authority was fraudulently obtained by the agent."}, {"section": "Terms Related to Agency", "term": "Agency Derived from Apparent Authority", "definition": "If principal leads a third party to believe that another acts as her agent, an agency relationship based upon apparent authority arises. If the third party reasonably relies upon the statement, the principal is contractually bound to the third party. Apparent authority may be revoked by giving notice to the third party."}, {"section": "Terms Related to Agency", "term": "Apparent Authority derived from Apparent Ownership", "definition": "If principal gives agent the indicia of ownership, the agent may deal with the property as if he/she had actual ownership. But apparent ownership is not derived from possession alone."}, {"section": "Terms Related to Agency", "term": "Agency Derived from Ostensible Authority", "definition": "Agency derived from ostensible authority applies when a principal has intentionally and negligently misled a third party that the agent has power to act for principal. Estoppel is invoked to prevent principal from denying the agency relationship and requiring the principal to compensate the third party for his/her losses."}, {"section": "Terms Related to Agency", "term": "Inherent Powers of Agents", "definition": "An agent possesses inherent powers that cannot be taken away by the principal. These inherent powers include the power to make express or implied warranties and the power to make representations regarding the agency subject matter. Usually inherent powers will only be recognized when protecting the interests of third parties."}, {"section": "Terms Related to Agency", "term": "Scope of Agent's Authority", "definition": "The powers of the agent are strictly construed by the courts and generally the duty to determine scope of agency has been placed upon the third party. The third party should determine scope subsequent to agreement. If specific powers are not given to the agent, the agent has implied power reasonably necessary to complete the agency contract and is also given implied powers to preserve principal's interest in emergencies."}, {"section": "Terms Related to Agency", "term": "Imputed Notice", "definition": "A principal will not be subject to imputed notice unless the agent had actual or apparent authority to receive notice from a third party."}, {"section": "Terms Related to Agency", "term": "Imputed Knowledge", "definition": "A principal will not be subject to imputed knowledge unless the facts concern the subject matter of the agency and the facts fall within its scope."}, {"section": "Terms Related to Agency", "term": "Ratification of Agent's Actions", "definition": "If an agent's unauthorized act is ratified, the ratification establishes the agency relationship as well as the agent's authority. The ratified act relates back to the date of the original agreement. Ratification exposes principal to liability for agent's actions."}, {"section": "Terms Related to Agency", "term": "Ratification of Actions", "definition": "An employer may only ratify those actions which could have been originally authorized. Ratification may be accomplished through acceptance or retention of benefits."}, {"section": "Terms Related to Agency", "term": "General Limits Placed upon Ratification", "definition": "When ratifying, the principal must ratify the entire act and not just a portion. Additionally, an offer by a third party is considered an offer and can therefore be withdrawn at any time prior to acceptance by ratification. Death of an offering third party also ends the principal's ability to ratify."}, {"section": "Terms Related to Agency", "term": "Ratification Not Allowed", "definition": "Neither actions violating public policy, nor actions completed on behalf of someone other than the principal, can be subject to ratification."}, {"section": "Terms Related to Agency", "term": "Ratification Shown by Conduct", "definition": "For there to be an effective ratification, the principal must act in a fashion which displays his/her intent to ratify. Actions displaying intent include principal: 1) voluntarily retains benefits of transaction, 2) takes some type of legal action protecting the act in question, 3) or her failure to repudiate the unauthorized act."}, {"section": "Terms Related to Agency", "term": "Principal's Knowledge of Material Facts", "definition": "A ratification is deemed proper only if the principal was aware of all material facts at the time of affirmance. If the principal was not in possession of such information, or was mistaken as to the facts, he/she may rescind the ratification absent a third party's detrimental reliance."}, {"section": "Terms Related to Agency", "term": "Ratification Relates Back", "definition": "Once an act is ratified, all liabilities and benefits relate back to the date of the original authorization. Exceptions to this general rule include: 1) where the action is illegal, 2) the principal lacks capacity, 3) where rights of third parties would be prejudiced."}, {"section": "Terms Related to Agency", "term": "Contractual Relationship Between Agent and Principal", "definition": "The principal-agent relationship is governed by the contractual nature of the contract instituting the relationship."}, {"section": "Terms Related to Agency", "term": "Principal's Duty to Pay Agent", "definition": "Principal has duty to pay agent, unless services are gratuitous."}, {"section": "Terms Related to Agency", "term": "Principal's Duty to Cooperate", "definition": "The principal may not interfere with agent's discharge of duties. Conversely, the principal must aid in discharging agent's duties."}, {"section": "Terms Related to Agency", "term": "Principal's Liability for Agent's Injury", "definition": "The principal is usually liable for injury to agent under state worker's compensation law."}, {"section": "Terms Related to Agency", "term": "Principal's Breach of Contract", "definition": "If agent's contractual agreement is breached by the principal, the agent is allowed to recover under a theory of set off, a right of indemnification from principal, by placing a lien against principal's property, by nonperformance of remaining obligations, and by demanding an accounting."}, {"section": "Terms Related to Agency", "term": "Agent's Duty to Perform", "definition": "Agent is obligated to use reasonable care, skill, and diligence when performing under the contract, even if the agent is providing services gratuitously. Agent's failure will create contractual liability. Additionally, tort liability may be imposed for agent's negligent actions or performance."}, {"section": "Terms Related to Agency", "term": "Agent's Fiduciary Duty to Principal", "definition": "The agent is bound by a fiduciary duty to the principal. A fiduciary duty demands loyalty and notification of items material to the agency."}, {"section": "Terms Related to Agency", "term": "Items Acquired During Agency Relationship", "definition": "Everything acquired by agent, during life of agency relationship, is property of the principal."}, {"section": "Terms Related to Agency", "term": "Breach of Fiduciary Duty", "definition": "Remedies for breach of fiduciary duty include contractual as well as tort recovery. Remedies include damages, imposition of a constructive trust, and rescission of agency contract. Principal also has a right to indemnification for any loss resulting from agent's breach of contract."}, {"section": "Terms Related to Agency", "term": "Liability to Third Parties", "definition": "In cases where the agent acts for an undisclosed principal, and there is no statement within the agreement indicating agency, the agent is liable to a third party, but if the agent acted with actual authority, then principal will also be liable to third party. Additionally, if the third party has notice that the agent acts for another, extrinsic evidence will be allowed to show that the principal and agent did not intend for the agent to be bound."}, {"section": "Terms Related to Agency", "term": "Principal Liable when Agent Acting with Authority", "definition": "If the agent acts within his/her capacity, and contracts in the name of the principal alone, only the third party and the principal will be bound by the agent's contract. If the agent contracts in his/her own alone or in both his/her name and the principal's name, liability depends upon the form of the agreement."}, {"section": "Terms Related to Agency", "term": "Principal Not Liable if Agent Acts Without Authority", "definition": "If an agent acts without authority, the principal will not be held liable unless he/she ratifies. The agent will be solely liable to the third party. If agent's representations regarding authority is intentional, he/she may be held liable in tort. A third party who subsequently performs based upon agent's representations, may be able to bring an action against principal to regain the bestowed benefit."}, {"section": "Terms Related to Agency", "term": "Significance of the Form of Agreement", "definition": "If nothing within the agreement indicates an agency relationship, then the agent and principal will be held jointly liable. If there is evidence of the agent's signing in a representative capacity, then the principal will be solely liable."}, {"section": "Terms Related to Agency", "term": "Employer Liable for Torts of Employees", "definition": "An employer will be liable for the torts of his or her employees if the employer directly authorizes, allows, or subsequently ratifies the employee's tortious action."}, {"section": "Terms Related to Agency", "term": "Employer bound by Independent Duties to Third Parties", "definition": "An employer may be found liable for breaching an independent duty of due care to the third party for hiring the tortious employee."}, {"section": "Terms Related to Agency", "term": "Fellow Servant Cannot Bring Suit Against Master", "definition": "If a fellow servant is injured by another servant working in a similar capacity for the master, the injured party cannot bring action under a theory of respondeat superior."}, {"section": "Terms Related to Agency", "term": "Rights of Third Party", "definition": "A third party has the right to bring an action against both the principal and the agent, but possesses a right to recover against only one party. Some jurisdictions hold that filing against one party releases the other party, but a majority of jurisdictions hold that the third party may file against both, and must make final decision regarding recovery prior to the court's judgment."}, {"section": "Terms Related to Agency", "term": "Rights Against Third Parties", "definition": "Generally, only the principal is entitled to enforce the contract against third parties. But where the agent has power to contract and an interest in the agreement, he/she is entitled to recover from a third party."}, {"section": "Terms Related to Agency", "term": "Agent for Two or More Principals", "definition": "An agent may represent two or more principals, owing each a fiduciary duty. Multiple agency relationships require the consent of each principal. Absent consent, a principal may void any subsequent act taken by agent."}, {"section": "Terms Related to Agency", "term": "Subagent", "definition": "A person to whom an agent has delegated the performance of an act for the principal."}, {"section": "Terms Related to Agency", "term": "Powers Delegated to Subagent", "definition": "Agent's powers can be delegated to subagent upon 1) consent of principal, or 2) if the delegated act is one of mechanics, 3) if the agent cannot lawfully perform the act but the subagent can, 4) if it is necessary to appoint a subagent or, 5) if it is customary to appoint a subagent."}, {"section": "Terms Related to Agency", "term": "Subagent's duty", "definition": "A subagent, hired by agent with principal's consent, is bound by same fiduciary duty as the agent. If subagent is not authorized by principal, there is no fiduciary duty running between the principal and the subagent and the principal is not obligated to compensate the subagent."}, {"section": "Terms Related to Agency", "term": "Master Servant Relationships May Extend to Subagent", "definition": "If an agent is authorized to hire a subagent, the master servant relationship will run from principal to the subagent. If the agent is not authorized to hire a subagent, the principal will not be liable for the tortious acts of subagent. If the agent hires a subagent in an emergency situation and in the best interests of the principal, then principal may be found liable for tortious acts of subagent."}, {"section": "Terms Related to Agency", "term": "Master Servant Relationship Does Not Apply to Independent Contractors", "definition": "Generally independent contractors have the right to control their own actions and are not considered servants; therefore respondeat superior does not apply. In the independent contractor context, the principal has merely bargained for the finished product and has no right to control the independent contractor's actions."}, {"section": "Terms Related to Agency", "term": "Exception to Inapplicability of Respondeat Superior to Independent Contractor", "definition": "If the independent contractor has been hired to conduct highly dangerous activity such as demolition, then the principal will remain liable for harm resulting from the dangerous activity."}, {"section": "Terms Related to Agency", "term": "Termination of the Agency Relationship", "definition": "Agent's authority to represent principal may be terminated by: 1) expiration of the agency term, 2) agency's purpose has been completed, 3) substantial change of agency's subject matter, 4) incapacity or death of principal or the agent or, 5) agreement or actions of the agent or principal, such as a unilateral renunciation or revocation."}, {"section": "Terms Related to Agency", "term": "Notice Required for Valid Termination", "definition": "To terminate a valid agency relationship between principal and agent, the termination must be communicated to the other party, except in situations of death or incapacity. If a third party has relied upon the apparent authority of an agent, the third party must receive notice that the agent no longer has authority. This third party requirement is subject to a death and incapacity exception."}, {"section": "Terms Related to Agency", "term": "Agency Created by Operation of Law", "definition": "Agency can arise without express or implied agreement in limited circumstances, such as emergency/necessity situations or by statute."}, {"section": "Terms Related to Agency", "term": "Equal Dignities Rule", "definition": "If the underlying contract the agent will execute must satisfy the Statute of Frauds (e.g., a real estate contract), the agent's authority to bind the principal to it must likewise be in writing."}, {"section": "Terms Related to Agency", "term": "Burden of Proof in Agency", "definition": "The party asserting that an agency relationship exists bears the burden of proving it."}, {"section": "Terms Related to Agency", "term": "Principal's Remedies for Agent Breach", "definition": "Constructive trust over profits, disgorgement, damages, rescission of the transaction, and forfeiture of the agent's compensation for a loyalty breach."}, {"section": "Terms Related to Agency", "term": "Agent's Personal Contract & Tort Liability", "definition": "An agent acting within actual or apparent authority for a disclosed principal is not personally liable on the resulting contract; the agent is personally liable if the principal is undisclosed or partially disclosed, if the agent lacked authority, or for the agent's own torts regardless of agency status."}, {"section": "Terms Related to Agency", "term": "Agent's Remedies for Principal Breach", "definition": "Suit for breach of contract, indemnification, or unpaid compensation."}, {"section": "Terms Related to Agency", "term": "Third Party Liability Rules in Agency", "definition": "Whether a third party can hold the principal or the agent liable on a contract depends on the principal's disclosure status (disclosed, partially disclosed/unidentified, or undisclosed) and whether the agent acted within actual or apparent authority."}, {"section": "Terms Related to Agency", "term": "Methods of Terminating Agency", "definition": "Mutual agreement, expiration of a stated term, accomplishment of the purpose, revocation by the principal, renunciation by the agent, death/incapacity of either party, or changed circumstances."}, {"section": "Terms Related to Agency", "term": "Termination of Agency by Operation of Law", "definition": "Agency automatically terminates on death/incapacity of principal or agent, the principal's bankruptcy, or a change in law making the agency's purpose illegal (subject to modern exceptions like durable powers of attorney)."}, {"section": "Terms Related to Partnerships", "term": "Partnership by Contract", "definition": "A partnership may be contractually formed by a written or oral agreement. A writing will be required in instances where the partnership is to exist for a periods exceeding one year. If there is no specified time period, the partnership will be presumed to be a partnership at will and terminable at any time. In order to become a partner, the party must have the ability to legally contract."}, {"section": "Terms Related to Partnerships", "term": "Partnership by Estoppel", "definition": "If a third party has detrimentally relied upon a party's representations regarding existence of alleged partnership, individuals may be estopped from denying existence of partnership."}, {"section": "Terms Related to Partnerships", "term": "Factors Indicating Partnership", "definition": "In the absence of affirmative evidence of an agreement to create a partnership, the courts will consider joint ownership of property, contribution of capital, and the sharing of income. These factors do not conclusively establish existence of partnership."}, {"section": "Terms Related to Partnerships", "term": "Partnership Property", "definition": "Property of a partnership includes all property originally brought into the partnership or subsequently acquired so long as the partners intended to devote property to the partnership. Intent can be determined by clear expression of intent or the surrounding circumstances of the property ownership."}, {"section": "Terms Related to Partnerships", "term": "Partner's Interest", "definition": "Each partner has a \"tenant in partnership\" with the other partners in all partnership property. A tenant in partnership allows a non-assignable equal right to possession for partnership purposes. Upon death this right will vest in surviving partners."}, {"section": "Terms Related to Partnerships", "term": "Partner's Personal Property", "definition": "Each partner possesses a personal property interest in the profits of the partnership."}, {"section": "Terms Related to Partnerships", "term": "Rights of Partners", "definition": "Partners have equal rights in the management and conduct of partnership business, unless the partnership agreement states otherwise."}, {"section": "Terms Related to Partnerships", "term": "Fiduciary Duties of Partners", "definition": "Partners owe each other the fiduciary duties of reasonable care, good faith, and loyalty. Included in the fiduciary duties owed to each other, partners owe a duty to: 1) account for profits and divide among partners according to the partnership agreement, 2) provide equal access to management, 3) hold assets as trustee for other partners, 4) make books and records accessible to all partners and, 5) not to compete against partnership."}, {"section": "Terms Related to Partnerships", "term": "Authority of Partners", "definition": "A partner may enter into enforceable contracts with third parties on behalf of the partnership, and may convey real property on behalf of the partnership if the transaction is conducted in the normal course of partnership business."}, {"section": "Terms Related to Partnerships", "term": "Exceptions to Partner's Authority", "definition": "A partnership is barred by the Uniform Partnership Act from contracting with a third party to dispose of partnership goodwill, submit partnership litigation to arbitration, or execute any agreement having the effect of making it impossible to carry on business."}, {"section": "Terms Related to Partnerships", "term": "Partners Claiming Third Party as Partner", "definition": "If a partner makes false representations regarding the partnership of a third party, the partner will be determined to have elected the third party to act as an agent and will be bound by their actions."}, {"section": "Terms Related to Partnerships", "term": "Third Party Claiming as Partner", "definition": "If a third party holds herself out as a partner in an actual or implied partnership, she will be liable to third parties acting upon such representations."}, {"section": "Terms Related to Partnerships", "term": "Partners Jointly and Severally Liable for Tort", "definition": "A partner will be held jointly and severally liable for partnership's tortious actions."}, {"section": "Terms Related to Partnerships", "term": "Dissolution of Partnership", "definition": "A partnership may be dissolved by: 1) expiration of partnership term, 2) purpose of partnership becomes illegal, 3) bankruptcy of a partner, 4) death of a partner (unless the deceased partner is a limited partner), or 5) by decision and act of any partner who complies with the terms of the partnership agreement governing dissolution. Furthermore, the Uniform Partnership Act allows for a court to dissolve a partnership upon any of the following: 1) insanity or permanent incapacity and, 2) improper conduct by partner. The partnership continues until its business is completed through the process of winding up."}, {"section": "Terms Related to Partnerships", "term": "Partner May have Right to Recover Damages on Dissolution", "definition": "If the dissolution of a partnership violates the terms of the partnership agreement, the non-dissolving partners may have a right to recover damages from dissolving partner. If the dissolution is within the terms of the partnership agreement there will be no action for damages."}, {"section": "Terms Related to Partnerships", "term": "Dissolution Resulting from Death", "definition": "If dissolution occurs as a result of a partner's death, the remaining partners have a right to possession of partnership property as well as a duty to complete partnership business."}, {"section": "Terms Related to Partnerships", "term": "Partner Liable for Partnership Debt Even if Dissolution Occurs", "definition": "Upon dissolution, the partners remain jointly liable for partnership debt even after dissolution. If a new partnership emerges from the old form, the new partnership assumes debt of the old partnership. The only exception to this rule is the case of a retired partner. The retired partner will not be liable for the debt acquired after her departure."}, {"section": "Terms Related to Partnerships", "term": "Default Partnership Formation", "definition": "Formed automatically by conduct satisfying the definition (co-ownership + profit motive + carrying on a business), regardless of the parties' subjective intent to 'form a partnership.'"}, {"section": "Terms Related to Partnerships", "term": "Joint and Several Liability of Partners", "definition": "Partners are jointly and severally liable for all partnership obligations (contract and tort); many jurisdictions require exhausting partnership assets before reaching a partner's personal assets."}, {"section": "Terms Related to Partnerships", "term": "Partnership Winding Up Process", "definition": "After dissolution, the partnership continues only to finish unfinished business, liquidate assets, pay creditors, and distribute remaining assets to partners per their interests."}, {"section": "Terms Related to Limited Partnerships, Limited Liability Partnerships, and Limited Liability Companies", "term": "Formation of Limited Partnership", "definition": "A limited partnership must be formed in compliance with formalities specified by statute in the jurisdiction, such as by filing with a designated government office or agency (in California, the Secretary of State) a certificate of limited partnership, which is signed by the general partners and which identifies the name of the limited partnership, its address, an agent for service of process, and the names of the general partners."}, {"section": "Terms Related to Limited Partnerships, Limited Liability Partnerships, and Limited Liability Companies", "term": "General Partner", "definition": "A general partner manages the business and has unlimited personal liability for the business's debts."}, {"section": "Terms Related to Limited Partnerships, Limited Liability Partnerships, and Limited Liability Companies", "term": "Limited Partner", "definition": "A limited partner cannot participate in managing the business, but makes an investment in the partnership and therefore has an ownership and profit-sharing interest. The limited partner's liability is limited to the amount of his or her investment."}, {"section": "Terms Related to Limited Partnerships, Limited Liability Partnerships, and Limited Liability Companies", "term": "Formation of Limited Liability Company", "definition": "A limited liability company must be formed in compliance with formalities specified by statute in the jurisdiction, such as by filing with a designated government office or agency (in California, the Secretary of State) articles of organization, which are signed by an organizer for the LLC, and which identify the name of the LLC, its purpose, its address, and an agent for service of process."}, {"section": "Terms Related to Limited Partnerships, Limited Liability Partnerships, and Limited Liability Companies", "term": "General vs. Limited Partner Characteristics", "definition": "General partners manage the business and have unlimited liability. Limited partners are passive investors with liability capped at their capital contribution, provided they do not participate in control under the traditional control rule."}, {"section": "Terms Related to Limited Partnerships, Limited Liability Partnerships, and Limited Liability Companies", "term": "LLP Partner Liability Status", "definition": "In a Limited Liability Partnership (LLP), all partners have limited-liability status for partnership debts and other partners' negligence/misconduct, but remain liable for their own personal wrongdoing."}, {"section": "Terms Related to Limited Partnerships, Limited Liability Partnerships, and Limited Liability Companies", "term": "LLC Pass-Through Taxation and Management", "definition": "Default pass-through taxation avoids entity-level tax; members (or managers, if manager-managed) have authority to bind the LLC in the ordinary course of business and owe fiduciary duties."}, {"section": "Terms related to Corporations", "term": "Close Corporation", "definition": "Close Corporations are Corporations with few shareholders and no regular markets for their shares. Since there is no public offering of shares, the shares are usually subject to restrictions on transfer."}, {"section": "Terms related to Corporations", "term": "Public Corporation", "definition": "A public corporation is a corporation with shares owned and traded by members of the general public. Public corporations are usually registered under the Securities Exchange Act of 1934, and their shares are usually traded on a securities exchange or through brokers \"over the counter.\""}, {"section": "Terms related to Corporations", "term": "Promoter", "definition": "A promoter is a person who organizes or founds the corporation."}, {"section": "Terms related to Corporations", "term": "Formation of Corporation", "definition": "A corporation must be formed in compliance with formalities specified by statute in the jurisdiction, such as by filing with a designated government office or agency (in California, the Secretary of State) articles of incorporation, which are signed by the promoter, and which identify the name of the corporation, its purpose, its address, an agent for service of process, and the initial number and classes of shares."}, {"section": "Terms related to Corporations", "term": "Articles of Incorporation", "definition": "The governing document that sets for the basic terms of a corporation's existence, including the number and classes of shares, and the purposes and duration of the corporation."}, {"section": "Terms related to Corporations", "term": "Bylaws", "definition": "The bylaws set forth the provisions adopted by a corporation for its government. The bylaws are subordinate to the articles of incorporation, but typically include details about how the corporation is to be run."}, {"section": "Terms related to Corporations", "term": "Shareholders", "definition": "Shareholders are the owners of the corporation in that they own shares of the corporation's stock."}, {"section": "Terms related to Corporations", "term": "Board of Directors", "definition": "The board of directors is elected by and represents the shareholders and has the legal responsibility for governing and supervising the corporation."}, {"section": "Terms related to Corporations", "term": "Officers", "definition": "Officers are hired or appointed by the board of directors to administer the day-to-day affairs of the corporation."}, {"section": "Terms related to Corporations", "term": "De Facto Corporation", "definition": "Under common law, a de facto corporation was a defectively formed corporation, which is treated as a valid corporation with regard to the limited liability of shareholders because there was a good faith attempt at proper formation of a corporation. In most jurisdictions, this doctrine has been abolished."}, {"section": "Terms related to Corporations", "term": "Corporation by Estoppel", "definition": "\"Corporation by estoppel\" is a doctrine which prevents a third person from holding a member of a nonexistent corporation personally liable on an obligation entered into in the name of the nonexistent corporation, on the theory that the third person relied on the existence of the corporation and is now estopped from denying that the corporation existed."}, {"section": "Terms related to Corporations", "term": "Piercing the Corporate Veil Doctrine", "definition": "\"Piercing the corporate veil\" refers to the ability of creditors to reach the stockholders of a validly formed corporation and hold them personally liable for debts of the corporation."}, {"section": "Terms related to Corporations", "term": "Ultra Vires", "definition": "Under common law, an act beyond those allowed by the articles of incorporation was ultra vires, and unenforceable. Modernly, the articles of incorporation for most corporations allow the corporation to do any lawful act."}, {"section": "Terms related to Corporations", "term": "Separateness (Alter Ego) Test", "definition": "The separateness or \"alter ego\" test is one method of deciding whether the corporate veil will be pierced to hold its shareholders personally liable for corporate debts. Under the test, the court is likely to pierce the corporate veil if the shareholders have failed to follow corporate formalities, such as by failing to issue any stock, hold directors' meetings, or where there is commingling of personal and corporate funds."}, {"section": "Terms related to Corporations", "term": "Undercapitalization Test", "definition": "The \"undercapitalization\" test is one method of deciding whether the corporate veil will be pierced to hold its shareholders personally liable for corporate debts. Under the test, the court is likely to pierce the corporate veil if the corporation was established without sufficient capital to meet its foreseeable business needs."}, {"section": "Terms related to Corporations", "term": "Share Transfer Restrictions", "definition": "Provisions (rights of first refusal, buy-sell agreements) restricting free transfer of shares, common in close corporations to preserve ownership control."}, {"section": "Terms related to Operation and Management of a Corporation", "term": "Authority of Shareholders", "definition": "Shareholders have the power to elect and remove directors, amend the articles of incorporation or bylaws, and approve or disapprove of fundamental corporate changes."}, {"section": "Terms related to Operation and Management of a Corporation", "term": "Authority of Directors", "definition": "Directors have authority to manage the corporation. The board appoints and supervises officers, who carry out the day-to-day business."}, {"section": "Terms related to Operation and Management of a Corporation", "term": "Authority of Officers", "definition": "Officers perform the day-to-day duties of running the business. Officers are appointed by the board of directors and may be removed by the board."}, {"section": "Terms related to Operation and Management of a Corporation", "term": "Express Actual Authority", "definition": "Express actual authority is that authority explicitly conferred upon an employee or an officer, by the bylaws or by valid resolutions of the board of directors, to act on behalf of the corporation."}, {"section": "Terms related to Operation and Management of a Corporation", "term": "Implied Actual Authority", "definition": "Implied actual authority is that authority to do what can be reasonably implied from a grant of express actual authority made to an officer or an employee."}, {"section": "Terms related to Operation and Management of a Corporation", "term": "Apparent Authority", "definition": "Apparent authority is that authority which the corporation has allowed third parties reasonably to believe the agent has."}, {"section": "Terms related to Operation and Management of a Corporation", "term": "Inherent Authority", "definition": "Inherent authority is the authority given the agent by reason of his particular corporate position."}, {"section": "Terms related to Operation and Management of a Corporation", "term": "Agency in Corporate Law", "definition": "In corporate law, the principal is the corporation."}, {"section": "Terms related to Operation and Management of a Corporation", "term": "De Facto Officer", "definition": "A de facto officer is an officer improperly appointed, or who continues to serve after his appointment has expired. His acts, however, will be given the same effect as those of a de jure officer."}, {"section": "Terms related to Operation and Management of a Corporation", "term": "Respondeat Superior and corporations", "definition": "Respondeat superior holds the corporation liable for actions by its agent which are within the scope of his or her authority even though the particular act was not specifically authorized."}, {"section": "Terms related to Operation and Management of a Corporation", "term": "Ratification", "definition": "Ratification by the board of directors will turn an unauthorized action into a legally binding act on the corporation."}, {"section": "Terms related to Operation and Management of a Corporation", "term": "Fiduciary Duty of Care", "definition": "A director or officer must use good faith and must exercise that degree of skill, diligence, and care that a reasonably prudent person would exercise in similar circumstances would use in a manner reasonably believed to be in the best interests of the corporation."}, {"section": "Terms related to Operation and Management of a Corporation", "term": "Business Judgment Rule", "definition": "A director or officer who makes a business decision for the corporation in good faith fulfills the duty of care if the director or officer is not interested (no conflict of interest) in the transaction, is informed to the extent reasonably believed to be appropriate under the circumstances, and rationally believes the business judgment is in the best interests of the corporation."}, {"section": "Terms related to Operation and Management of a Corporation", "term": "Fiduciary Duty of Loyalty", "definition": "A director or officer may not engage in self-dealing, nor violate the corporate opportunity doctrine, nor otherwise use his position to further personal interests rather than those of the corporation."}, {"section": "Terms related to Operation and Management of a Corporation", "term": "Corporate Opportunity Doctrine", "definition": "The Corporate Opportunity Doctrine bars directors and officers from diverting to themselves a business opportunity in which the corporation has an expectancy, property interest, or right; or which in fairness should otherwise belong to the corporation."}, {"section": "Terms related to Operation and Management of a Corporation", "term": "Business Opportunity", "definition": "A business opportunity is considered a corporate opportunity if it was reasonably foreseeable that the corporation would have been interested in it."}, {"section": "Terms related to Operation and Management of a Corporation", "term": "Corporate Formalities in Formation", "definition": "Requires filing articles of incorporation, adopting bylaws, holding an organizational meeting, issuing stock, and appointing initial directors/officers."}, {"section": "Terms related to Operation and Management of a Corporation", "term": "Piercing Corporate Veil Factors", "definition": "Courts disregard the corporate form and hold shareholders personally liable where the corporation is undercapitalized, formalities are ignored, funds are commingled with personal assets (alter ego), or the corporate form is used to perpetrate fraud or injustice."}, {"section": "Terms related to Operation and Management of a Corporation", "term": "Shareholder Ownership & Voting Rights", "definition": "Shareholders hold ownership rights to declared dividends and residual assets on dissolution, plus voting rights to elect directors and approve fundamental corporate changes."}, {"section": "Terms related to Operation and Management of a Corporation", "term": "Proxies in Corporate Voting", "definition": "A shareholder may appoint another person or entity to vote their shares on their behalf; typically revocable unless coupled with an interest."}, {"section": "Terms related to Stocks and Their Issuance", "term": "Authorization", "definition": "Authorization consists of a description in the Articles of Incorporation of the classes of stock, the number of shares of each class, and the par value (if any) of the shares."}, {"section": "Terms related to Stocks and Their Issuance", "term": "Par Value", "definition": "Par value of shares is an arbitrary or nominal value assigned to each such share that must be received by the corporation before the stock can be issued as fully paid."}, {"section": "Terms related to Stocks and Their Issuance", "term": "Stated Value", "definition": "Stated value is the price set by the directors at which the shares are to be sold when there is no price stated in the Articles of Incorporation."}, {"section": "Terms related to Stocks and Their Issuance", "term": "No Par Stock", "definition": "\"No par stock\" are shares which are stated to have no par value. Such shares are issued for the consideration decided by the board of directors."}, {"section": "Terms related to Stocks and Their Issuance", "term": "Bonus Stock", "definition": "Bonus stock are par value shares issued for no consideration."}, {"section": "Terms related to Stocks and Their Issuance", "term": "Discount Shares", "definition": "Discount shares are par value shares issued for cash less than par value."}, {"section": "Terms related to Stocks and Their Issuance", "term": "Watered Stock", "definition": "Watered stock are par value shares issued for property which has been overvalued and is not worth the aggregate par value of the issued shares."}, {"section": "Terms related to Stocks and Their Issuance", "term": "Primary Stock Sales", "definition": "Primary stock sales are the original issuance of shares by a corporation."}, {"section": "Terms related to Stocks and Their Issuance", "term": "Secondary Stock Sales", "definition": "Secondary stock sales are the resale of shares by the shareholder."}, {"section": "Terms related to Stocks and Their Issuance", "term": "Outstanding Shares", "definition": "Outstanding shares are shares that have been issued by the corporation."}, {"section": "Terms related to Stocks and Their Issuance", "term": "Treasury Shares", "definition": "Treasury shares are issued shares that have been repurchased by the corporation."}, {"section": "Terms related to Stocks and Their Issuance", "term": "Debt Securities", "definition": "A debt security obligates the corporation to repay the debt owed to the shareholder or outsiders who loaned money to the corporation by a specified date."}, {"section": "Terms related to Stocks and Their Issuance", "term": "Registration Type of State Security Statute", "definition": "A \"registration type\" of state security statute requires new shares of a corporation to be registered with the appropriate state official before they are sold."}, {"section": "Terms related to Stocks and Their Issuance", "term": "Fraud Type of State Security Statute", "definition": "A \"fraud type\" of state security statute does not require filing prior to selling stock, but penalties are imposed for fraudulent practices."}, {"section": "Terms related to Stocks and Their Issuance", "term": "Registration of Broker-Realtor Type State Security Statute", "definition": "A \"registration of broker-realtor type\" of state security statute requires the registration of broker-dealers to help prevent fraud by those who market stock."}, {"section": "Terms related to Stocks and Their Issuance", "term": "Permit Type of State Security Statute", "definition": "A \"permit type\" of state security statute requires the state to find that the proposed sale is fair, just, and equitable before a permit is issued and the transaction can occur."}, {"section": "Terms related to Stocks and Their Issuance", "term": "Pre-Incorporation Subscriptions", "definition": "A pre-incorporation subscription is a subscription for shares in a corporation yet to be formed and thus is not an enforceable contract between the corporation and the subscriber because it is only an offer."}, {"section": "Terms related to Stocks and Their Issuance", "term": "Post-Incorporation Subscriptions", "definition": "Post-incorporation subscriptions are stock subscriptions entered into after incorporation. They are an irrevocable contract obligating the corporation to issue and the subscriber to purchase the shares in question."}, {"section": "Terms related to Stocks and Their Issuance", "term": "Dividend", "definition": "A dividend is a payment to the shareholders from or out of current or past earnings."}, {"section": "Terms related to Stocks and Their Issuance", "term": "Straight Voting", "definition": "Straight voting by a shareholder allows one vote per share."}, {"section": "Terms related to Stocks and Their Issuance", "term": "Cumulative Voting", "definition": "Cumulative voting gives each shareholder a number of votes equal to the number of directors to be elected multiplied by the number of shares he holds."}, {"section": "Terms related to Stocks and Their Issuance", "term": "Right of Inspection", "definition": "The right of inspection at common law gave each shareholder a qualified right to inspect corporate records at any reasonable time. The shareholder must be acting in good faith for a proper purpose, i.e., for a purpose relevant to his status as a shareholder."}, {"section": "Terms related to Stocks and Their Issuance", "term": "Shareholder Agreements", "definition": "Shareholder agreements are agreements between the shareholders of a corporation as a means of attaining control over corporate affairs."}, {"section": "Terms related to Stocks and Their Issuance", "term": "Pooling Agreement", "definition": "A pooling agreement is a shareholder agreement in the form of a contract requiring the shareholder to vote her shares in a specified way for a specified period of time."}, {"section": "Terms related to Stocks and Their Issuance", "term": "Voting Trust", "definition": "A voting trust is a shareholder agreement where each participating shareholder transfers legal title of his shares to a trustee, who then votes the shares. The shareholder receives in return a voting trust certificate which evidences his beneficial ownership."}, {"section": "Terms related to Stocks and Their Issuance", "term": "Right of First Refusal", "definition": "A right of first refusal can be in favor of the corporation or the other shareholders. The agreement is that if a shareholder wishes to sell any shares, they must first be offered to the corporation (or the other shareholders) at the proposed buyer's price."}, {"section": "Terms related to Stocks and Their Issuance", "term": "Equal Opportunity Doctrine", "definition": "The Equal Opportunity Doctrine compels a controlling shareholder to share his premium, i.e., an amount above the market value of his shares for sale of control over the control, with minority shareholders."}, {"section": "Terms related to Stocks and Their Issuance", "term": "Common Stock vs. Preferred Stock", "definition": "Common stock represents residual ownership with voting rights and last priority on liquidation. Preferred stock gets priority on dividends and liquidation payouts, but usually carries no voting rights."}, {"section": "Terms related to Stocks and Their Issuance", "term": "Consideration for Share Issuance", "definition": "Shares must be issued for adequate consideration (cash, property, or services already performed); watered stock issued for inadequate consideration can expose directors/shareholders to liability."}, {"section": "Terms related to Stocks and Their Issuance", "term": "Underwriting", "definition": "Process where an investment bank purchases newly issued securities from the issuer and resells them to the public, on a firm-commitment or best-efforts basis."}, {"section": "Terms related to Stocks and Their Issuance", "term": "Blue Sky Laws", "definition": "State securities laws regulating the offer and sale of securities within that specific state to protect investors from fraud, alongside federal regulation."}, {"section": "Terms related to Stocks and Their Issuance", "term": "Section 5 of the Securities Act of 1933", "definition": "Requires registration of securities with the SEC before public offer or sale, absent an exemption; mandates full disclosure via a registration statement and prospectus."}, {"section": "Terms related to Stocks and Their Issuance", "term": "Securities Exchange Act of 1934 Overview", "definition": "Regulates secondary trading of securities; imposes ongoing financial disclosure obligations on public companies, proxy solicitation rules, and antifraud provisions."}, {"section": "Terms Related to Insider Trading", "term": "Insider", "definition": "An insider is a person who has a fiduciary relationship to a corporation that requires him to keep non-public information confidential. Typically, a director, officer, employee, or a person who obtains inside information through his or her professional relationship with the corporation."}, {"section": "Terms Related to Insider Trading", "term": "Inside Information", "definition": "Information about a company's financial or market situation which is not obtained from public disclosure, but from a source within the company or from a source that owes a duty to keep the information confidential."}, {"section": "Terms Related to Insider Trading", "term": "Affirmative Misrepresentation Rule", "definition": "An insider (director, officer, or controlling shareholder) who trades on the basis of affirmative misrepresentations (lies or half truths) made to a trading partner will be liable for common law fraud."}, {"section": "Terms Related to Insider Trading", "term": "Insider's duty to disclose to shareholders", "definition": "At common law, corporate insiders, directors and officers owed no duty of disclosure to an investor."}, {"section": "Terms Related to Insider Trading", "term": "Special Facts Doctrine", "definition": "The Special Facts Doctrine provides an exception to the common law rule that insiders owe no duty of disclosure to an investor. The doctrine will protect an injured shareholder if an existing shareholder sells in privity to a director, officer, or insider who has special information about the corporation which would materially impact the investors decision to trade, and the information was not disclosed to the shareholder."}, {"section": "Terms Related to Insider Trading", "term": "Insider's duty to disclose to corporation", "definition": "All corporate information belongs to the corporation, so an insider who trades on it has usurped a corporate asset, and the corporation can bring suit."}, {"section": "Terms Related to Insider Trading", "term": "Rule 10b-5 of the Securities Exchange Act of 1934", "definition": "It is unlawful for any person, directly or indirectly, by use of any means or instrumentality of interstate commerce or the mails, or of any facility of any national securities exchange, to employ any fraudulent or manipulative devices in connection with the purchase or sale of securities."}, {"section": "Terms Related to Insider Trading", "term": "Abstain or Disclose Rule", "definition": "One who has a fiduciary duty of trust and confidence to shareholders or to a source of confidential information and is in receipt of material non-public information has a duty to abstain from trading or to disclose the information public."}, {"section": "Terms Related to Insider Trading", "term": "Insider Trading and Agency Theory (Misappropriation Theory)", "definition": "Under Diamond v. Oreamuno, an agent entrusted with information for the purpose of carrying on his principal's business may use the information for that purpose only. If an agent exploits, for his own benefit, knowledge or information acquired by virtue of a fiduciary relationship with the corporation, the corporation may recover the agent's profits."}, {"section": "Terms Related to Insider Trading", "term": "Tipper", "definition": "A tipper is an insider who discloses material inside information for trading or other personal purposes, in breach of the fiduciary duty to the corporation."}, {"section": "Terms Related to Insider Trading", "term": "Tippee", "definition": "A tippee is a non-insider who receives inside information from a tipper. A tippee who trades on the basis of the inside information is liable for misuse of that information if the tipper has breached a fiduciary duty by disclosing to the tippee and the tippee knows or should know there has been a breach."}, {"section": "Terms Related to Insider Trading", "term": "Section 16(b) of the Securities Exchange Act of 1934", "definition": "Section 16(b) of the Securities Exchange Act of 1934 prohibits short-swing trading by specified insiders by requiring that any profits made within a six-month period through a purchase and sale (or sale and purchase) of a corporation's securities, by a director, officer, or beneficial owner of more than 10% of a class of stock, must automatically be returned to the corporation."}, {"section": "Terms Related to Insider Trading", "term": "Proxy", "definition": "A proxy is a power of attorney given by the shareholder to someone else to vote his shares, establishing a principal to agent relationship."}, {"section": "Terms Related to Insider Trading", "term": "Section 14 of the Securities Exchange Act of 1934", "definition": "The SEC requires in Section 14 that shareholders of a corporation whose securities are registered under Section 12 of the Securities Exchange Act of 1934 receive a proxy statement prior to a shareholder meeting, whether an annual or special meeting. Additional portions of the rule provide that shareholders may send their own proxy statements under specified conditions."}, {"section": "Terms Related to Insider Trading", "term": "Sarbanes-Oxley Act (SOX)", "definition": "Federal law enacted after corporate scandals; imposes enhanced financial-disclosure requirements, CEO/CFO certification of financial statements, auditor-independence rules, and criminal penalties for securities fraud and document destruction."}, {"section": "Terms Related to Major Corporate Actions", "term": "Insolvency", "definition": "Insolvency is a financial condition in which one's liabilities exceeds one's assets."}, {"section": "Terms Related to Major Corporate Actions", "term": "Bankruptcy Definition of Insolvency", "definition": "The bankruptcy definition of insolvency finds a corporation insolvent when the value of its assets is less than its debts."}, {"section": "Terms Related to Major Corporate Actions", "term": "Equity Definition of Insolvency", "definition": "The equity definition of insolvency finds a corporation insolvent if it is unable to meet current debts from current assets as the debts mature."}, {"section": "Terms Related to Major Corporate Actions", "term": "Redemption of Shares", "definition": "In a redemption, the corporation acquires outstanding shares pursuant to a provision in the articles applicable to an entire class of shares."}, {"section": "Terms Related to Major Corporate Actions", "term": "Merger", "definition": "A merger is a transfer, by operation of law, of all of the assets of the acquired corporation to an existing acquiring corporation."}, {"section": "Terms Related to Major Corporate Actions", "term": "Triangular Merger", "definition": "A triangular merger is a merger which involves a subsidiary of the acquiring corporation created specifically for the merger transaction."}, {"section": "Terms Related to Major Corporate Actions", "term": "Direct Suit", "definition": "A direct suit can be brought by an individual shareholder for harm done directly to him in his capacity as a shareholder."}, {"section": "Terms Related to Major Corporate Actions", "term": "Derivative Suit", "definition": "A derivative suit is a suit brought by a shareholder on behalf of the corporation for a harm done to the corporation."}, {"section": "Terms Related to Major Corporate Actions", "term": "Deadlock", "definition": "Deadlock in a closely held corporation arises when a control structure permits either of two or more factions of shareholders to block corporate action if they disagree with some aspect of corporate policy."}, {"section": "Terms Related to Major Corporate Actions", "term": "Cash Tender Offer", "definition": "A cash tender offer is a technique by which an aggressor corporation seeks to obtain control of a target corporation, by making a public purchase offer for a specified fraction (usually majority) of the target corporation's assets."}, {"section": "Terms Related to Major Corporate Actions", "term": "Public Exchange Offer", "definition": "A public exchange offer is a technique by which an aggressor corporation seeks to obtain control over a target corporation, by offering to exchange a package of its securities for the target corporation's voting shares."}, {"section": "Terms Related to Major Corporate Actions", "term": "Direct Action Lawsuit", "definition": "Brought by a shareholder in their own right for an injury suffered individually and distinctly from other shareholders (e.g., denial of voting or inspection rights)."}, {"section": "Terms Related to Major Corporate Actions", "term": "Derivative Action Lawsuit", "definition": "Brought by a shareholder on behalf of the corporation to redress an injury to the corporation itself (e.g., director breach of fiduciary duty); generally requires demand on the board first; recovery goes to the corporation."}, {"section": "Terms Related to Major Corporate Actions", "term": "Shareholder Appraisal Rights", "definition": "A dissenting shareholder's statutory right, in certain fundamental transactions (e.g., mergers), to have their shares independently valued and receive fair cash value instead of the merger consideration."}, {"section": "Terms Related to Major Corporate Actions", "term": "Corporate Takeovers", "definition": "An attempt by one company or investor group to acquire control of another, often via a tender offer to shareholders; may be friendly (negotiated with board) or hostile (opposed by board)."}, {"section": "Terms Related to Major Corporate Actions", "term": "Corporate Defensive Tactics", "definition": "Measures a target board uses to resist a hostile takeover --- poison pills (rights plans diluting the acquirer's stake), staggered boards, white knights, greenmail, golden parachutes; subject to heightened judicial scrutiny."}, {"section": "Terms Related to Major Corporate Actions", "term": "Tender Offer", "definition": "A public offer made directly to a target's shareholders to purchase their shares (often at a premium above market price), typically used to effect a takeover; regulated under the Williams Act."}, {"section": "Terms Related to Major Corporate Actions", "term": "Redemption vs. Repurchase of Shares", "definition": "Redemption: the corporation's reacquisition of shares under a right reserved in the stock itself. Repurchase (buyback): the corporation's voluntary reacquisition of its own outstanding shares on the open market or via tender offer."}, {"section": "Terms Related to Major Corporate Actions", "term": "Dissolution and Liquidation Procedure", "definition": "Voluntary dissolution requires board and shareholder approval plus filing articles of dissolution; involuntary dissolution can be ordered by a court (e.g., deadlock, oppression); liquidation involves winding up affairs, paying creditors, and distributing remaining assets to shareholders."}];

    function shuffleArray(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function App() {
      const sections = useMemo(() => {
        const seen = [];
        CARDS.forEach(c => { if (!seen.includes(c.section)) seen.push(c.section); });
        return seen;
      }, []);

      const [activeSection, setActiveSection] = useState('All');
      const [pos, setPos] = useState(0);
      const [flipped, setFlipped] = useState(false);
      const [known, setKnown] = useState({});
      const [shuffleOn, setShuffleOn] = useState(false);

      const deck = useMemo(() => {
        const idxs = CARDS
          .map((c, i) => ({ c, i }))
          .filter(({ c }) => activeSection === 'All' || c.section === activeSection)
          .map(({ i }) => i);
        return shuffleOn ? shuffleArray(idxs) : idxs;
      }, [activeSection, shuffleOn]);

      useEffect(() => {
        setPos(0);
        setFlipped(false);
      }, [activeSection, shuffleOn]);

      const total = deck.length;
      const currentIdx = deck[pos];
      const current = CARDS[currentIdx];

      const goNext = () => {
        setFlipped(false);
        setPos(p => (p + 1) % total);
      };
      const goPrev = () => {
        setFlipped(false);
        setPos(p => (p - 1 + total) % total);
      };
      const markKnown = (val) => {
        setKnown(k => ({ ...k, [currentIdx]: val }));
        goNext();
      };
      const resetProgress = () => {
        setKnown({});
        setPos(0);
        setFlipped(false);
      };

      const knownCount = Object.values(known).filter(v => v === true).length;
      const reviewCount = Object.values(known).filter(v => v === false).length;

      if (total === 0) {
        return <div style={{ padding: 24 }}>No cards in this section.</div>;
      }

      return (
        <div style={{
          maxWidth: 720,
          margin: '0 auto',
          padding: '10px 16px 32px',
          width: '100%'
        }}>
          <div style={{ textAlign: 'center', marginBottom: 16 }}>
            <h1 style={{ fontSize: 22, fontWeight: 700, margin: '0 0 4px', color: '#2d2a4a' }}>
              Business Associations — Legal Definitions
            </h1>
            <p style={{ fontSize: 13, color: '#6b7280', margin: 0 }}>
              {total} card{total !== 1 ? 's' : ''} in this set · Card {pos + 1} of {total}
            </p>
          </div>

          <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap', justifyContent: 'center', marginBottom: 16 }}>
            <select
              value={activeSection}
              onChange={(e) => setActiveSection(e.target.value)}
              style={{
                padding: '8px 12px',
                borderRadius: 10,
                border: '1px solid #d8dae0',
                fontSize: 13,
                background: '#fff',
                color: '#2d2a4a',
                maxWidth: 280
              }}
            >
              <option value="All">All Sections ({CARDS.length})</option>
              {sections.map(s => {
                const count = CARDS.filter(c => c.section === s).length;
                return <option key={s} value={s}>{s} ({count})</option>;
              })}
            </select>

            <button
              onClick={() => setShuffleOn(s => !s)}
              style={{
                display: 'flex', alignItems: 'center', gap: 6,
                padding: '8px 12px', borderRadius: 10,
                border: '1px solid #d8dae0',
                background: shuffleOn ? '#4f46e5' : '#fff',
                color: shuffleOn ? '#fff' : '#2d2a4a',
                fontSize: 13, cursor: 'pointer'
              }}
            >
              <i data-lucide="shuffle" style={{ width: 14, height: 14 }}></i> Shuffle
            </button>

            <button
              onClick={resetProgress}
              style={{
                display: 'flex', alignItems: 'center', gap: 6,
                padding: '8px 12px', borderRadius: 10,
                border: '1px solid #d8dae0', background: '#fff', color: '#2d2a4a',
                fontSize: 13, cursor: 'pointer'
              }}
            >
              <i data-lucide="list-restart" style={{ width: 14, height: 14 }}></i> Reset
            </button>
          </div>

          <div style={{ textAlign: 'center', fontSize: 12, color: '#6b7280', marginBottom: 10 }}>
            {current.section}
          </div>

          <div
            onClick={() => setFlipped(f => !f)}
            style={{
              perspective: '1200px',
              cursor: 'pointer',
              minHeight: 320,
            }}
          >
            <div style={{
              position: 'relative',
              width: '100%',
              minHeight: 320,
              transformStyle: 'preserve-3d',
              transition: 'transform 0.5s',
              transform: flipped ? 'rotateY(180deg)' : 'rotateY(0deg)'
            }}>
              {/* Front */}
              <div style={{
                position: 'absolute', inset: 0,
                backfaceVisibility: 'hidden',
                background: 'linear-gradient(135deg, #4f46e5, #7c3aed)',
                borderRadius: 16,
                display: 'flex', flexDirection: 'column',
                alignItems: 'center', justifyContent: 'center',
                padding: 28, textAlign: 'center',
                boxShadow: '0 8px 24px rgba(79,70,229,0.25)'
              }}>
                <div style={{ fontSize: 11, letterSpacing: 1.5, color: 'rgba(255,255,255,0.7)', textTransform: 'uppercase', marginBottom: 14 }}>
                  Term
                </div>
                <div style={{ fontSize: 26, fontWeight: 700, color: '#fff', lineHeight: 1.3 }}>
                  {current.term}
                </div>
                <div style={{ fontSize: 12, color: 'rgba(255,255,255,0.6)', marginTop: 24 }}>
                  Tap to reveal legal definition
                </div>
              </div>

              {/* Back */}
              <div style={{
                position: 'absolute', inset: 0,
                backfaceVisibility: 'hidden',
                transform: 'rotateY(180deg)',
                background: '#fff',
                border: '2px solid #4f46e5',
                borderRadius: 16,
                display: 'flex', flexDirection: 'column',
                justifyContent: 'center',
                padding: '24px 26px',
                boxShadow: '0 8px 24px rgba(0,0,0,0.08)',
                overflowY: 'auto'
              }}>
                <div style={{ fontSize: 11, letterSpacing: 1.5, color: '#9ca3af', textTransform: 'uppercase', marginBottom: 8, textAlign: 'center' }}>
                  {current.term} — Legal Definition
                </div>
                <div style={{ fontSize: 15, lineHeight: 1.55, color: '#1f2430', textAlign: 'left' }}>
                  {current.definition}
                </div>
              </div>
            </div>
          </div>

          <div style={{ display: 'flex', justifyContent: 'center', gap: 10, marginTop: 20 }}>
            <button onClick={goPrev} style={navBtn}>
              <i data-lucide="chevron-left" style={{ width: 18, height: 18 }}></i>
            </button>

            <button onClick={() => markKnown(false)} style={{ ...actionBtn, background: '#fee2e2', color: '#b91c1c' }}>
              <i data-lucide="x" style={{ width: 16, height: 16 }}></i> Review again
            </button>

            <button onClick={() => markKnown(true)} style={{ ...actionBtn, background: '#dcfce7', color: '#15803d' }}>
              <i data-lucide="check" style={{ width: 16, height: 16 }}></i> Got it
            </button>

            <button onClick={goNext} style={navBtn}>
              <i data-lucide="chevron-right" style={{ width: 18, height: 18 }}></i>
            </button>
          </div>

          <div style={{ textAlign: 'center', marginTop: 18, fontSize: 12, color: '#6b7280' }}>
            <span style={{ color: '#15803d', fontWeight: 600 }}>✓ {knownCount} known</span> &nbsp;·&nbsp;
            <span style={{ color: '#b91c1c', fontWeight: 600 }}>✕ {reviewCount} to review</span>
          </div>
        </div>
      );
    }

    const navBtn = {
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      width: 42, height: 42, borderRadius: '50%',
      border: '1px solid #d8dae0', background: '#fff', color: '#2d2a4a',
      cursor: 'pointer'
    };

    const actionBtn = {
      display: 'flex', alignItems: 'center', gap: 6,
      padding: '10px 16px', borderRadius: 10,
      border: 'none', fontSize: 13, fontWeight: 600, cursor: 'pointer'
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);

    // Render icons after React mounts
    setTimeout(() => { if (window.lucide) lucide.createIcons(); }, 100);
  </script>
</body>
</html>
